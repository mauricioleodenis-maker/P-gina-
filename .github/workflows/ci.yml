name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
  CLINICAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  CLINICAL_KEY_VERSION: "1"

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependencias (solo produccion)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  rls:
    name: Tests SQL (RLS, solape, numeracion, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-contrib
      - name: Ejecutar tests SQL
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: bash supabase/tests/run.sh
      - name: Comprobar que ninguna tabla de public queda sin RLS
        run: |
          grep -c "enable row level security" supabase/migrations/0001_init.sql
          tables=$(grep -ciE "^create table public\." supabase/migrations/0001_init.sql)
          rls=$(grep -ciE "alter table public\.[a-z_]+ +enable row level security" supabase/migrations/0001_init.sql)
          echo "tablas=$tables rls=$rls"
          test "$tables" -eq "$rls"

  e2e:
    name: E2E y accesibilidad (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- e2e/smoke e2e/legal e2e/p4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
